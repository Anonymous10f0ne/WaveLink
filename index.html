```html <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#030712"> <meta name="description" content="WaveLink — Ride the Wave. Own the Moment. Join the next current of creators."> <title>WaveLink | Join the Wave</title>  <style> :root{     --bg:#020611;     --cyan:#00f5ff;     --blue:#1687ff;     --purple:#824dff;     --pink:#ff35c8;     --white:#ffffff;     --muted:#8796aa;     --border:rgba(255,255,255,.11);     --card:rgba(255,255,255,.055); }  *{     box-sizing:border-box;     margin:0;     padding:0; }  html{     scroll-behavior:smooth; }  body{     min-height:100vh;     overflow-x:hidden;     color:var(--white);     font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;     background:         radial-gradient(circle at 15% 5%,rgba(0,245,255,.14),transparent 28%),         radial-gradient(circle at 85% 8%,rgba(130,77,255,.17),transparent 30%),         radial-gradient(circle at 50% 100%,rgba(255,53,200,.08),transparent 35%),         var(--bg); }  a{ color:inherit; text-decoration:none; }  .container{     width:min(1120px,calc(100% - 30px));     margin:auto; }  /* NAV */ nav{     position:fixed;     top:0;     left:0;     right:0;     height:74px;     z-index:1000;     background:rgba(2,6,17,.72);     border-bottom:1px solid rgba(255,255,255,.07);     backdrop-filter:blur(22px); }  .nav-inner{     height:100%;     display:flex;     align-items:center;     justify-content:space-between; }  /* HERO */ .hero{     min-height:100vh;     display:flex;     align-items:center;     padding:125px 0 80px;     text-align:center; }  .hero-content{     width:100%;     max-width:950px;     margin:auto; }  /* WAITLIST */ .waitlist{     max-width:650px;     margin:38px auto 0;     padding:9px;     display:flex;     gap:8px;     border:1px solid rgba(255,255,255,.14);     border-radius:999px;     background:rgba(255,255,255,.055);     position:relative; }  .waitlist label{     position:absolute;     left:-9999px; }  .waitlist input{     flex:1;     padding:15px 18px;     border:0;     outline:0;     background:transparent;     color:white;     font-size:14px; }  .waitlist input:focus{     outline:2px solid var(--cyan);     border-radius:999px; }  .join-button{     border:0;     cursor:pointer;     padding:0 24px;     border-radius:999px;     color:white;     background:linear-gradient(100deg,var(--cyan),var(--blue),var(--purple));     font-size:12px;     font-weight:950; }  .join-button[disabled]{     opacity:.6;     cursor:not-allowed; }  .success{     display:none;     max-width:650px;     margin:20px auto 0;     padding:18px;     border:1px solid rgba(57,245,162,.25);     border-radius:18px;     background:rgba(57,245,162,.06);     color:#86ffc5; }  .success.show{     display:block; }  /* SCREEN READER ONLY */ .sr-only{     position:absolute;     width:1px;     height:1px;     padding:0;     margin:-1px;     overflow:hidden;     clip:rect(0,0,0,0);     border:0; } </style> </head>  <body>  <header> <nav> <div class="container nav-inner"> <a href="#top">WaveLink</a> </div> </nav> </header>  <main id="top">  <section class="hero"> <div class="container hero-content">  <h1>Ride the Wave</h1> <p>Join the waitlist</p>  <form class="waitlist" id="waitlistForm" aria-label="WaveLink waitlist form">  <label for="email">Email address</label>  <input     id="email"     name="email"     type="email"     placeholder="Enter your email"     autocomplete="email"     required     aria-required="true" />  <button class="join-button" id="submitBtn" type="submit">     JOIN </button>  </form>  <p class="sr-only" aria-live="polite" id="statusText"></p>  <div class="success" id="successMessage" role="status" aria-live="polite">     🌊 You're on the list. Welcome to WaveLink. </div>  </div> </section>  </main>  <script> const form = document.getElementById("waitlistForm"); const email = document.getElementById("email"); const success = document.getElementById("successMessage"); const btn = document.getElementById("submitBtn"); const statusText = document.getElementById("statusText");  form.addEventListener("submit", async (e) => {     e.preventDefault();      const value = email.value.trim();      if(!value.includes("@")){         statusText.textContent = "Please enter a valid email.";         email.focus();         return;     }      btn.disabled = true;     btn.textContent = "Joining...";      try {         const res = await fetch("/api/waitlist", {             method: "POST",             headers: {                 "Content-Type": "application/json"             },             body: JSON.stringify({ email: value })         });          if(!res.ok){             throw new Error("Request failed");         }          form.style.display = "none";         success.classList.add("show");         statusText.textContent = "Successfully joined waitlist.";      } catch (err) {         btn.disabled = false;         btn.textContent = "JOIN";         statusText.textContent = "Something went wrong. Try again.";     } }); </script>  </body> </html> ```
